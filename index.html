<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pod.AI</title>
  <meta name="description" content="A daily, fully automated podcast about the last 24 hours in AI Engineering.">
  <link rel="alternate" type="application/rss+xml" title="Pod.AI" href="feed.xml">
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --accent: #a5b4fc; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 0 auto; padding: 4rem 1rem; }
    h1 { margin: 0 0 .5rem; font-size: 2.5rem; }
    p { color: var(--muted); }
    a { color: var(--accent); }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Pod.AI</h1>
    <p>A daily 2–3 minute chat between Lucas and Sarah about what happened in AI Engineering in the last 24 hours.</p>
    <p>Subscribe with any podcast app: <a href="feed.xml">RSS feed</a> (coming soon).</p>
    <small>Episodes are written and voiced by AI, based on public sources cited in each episode's notes.</small>
  </main>
</body>
</html>
